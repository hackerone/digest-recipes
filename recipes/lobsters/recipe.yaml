id: lobsters
version: 1
matches:
  - "https://lobste.rs/*"
description: "Lobsters stories (open)"
fetchMode: dom
content:
  item: "article, [role='article'], .post"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2, h3"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "a, span"
  body:
    selector: "p, span"
  image:
    selector: "img"
    attribute: "src"
