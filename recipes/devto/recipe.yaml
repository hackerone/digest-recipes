id: devto
version: 1
matches:
  - "https://dev.to/*"
description: "DEV Community posts"
fetchMode: dom
content:
  item: "article, .post-card"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
