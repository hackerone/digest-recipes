id: arxiv
version: 1
matches:
  - "https://arxiv.org/*"
  - "https://export.arxiv.org/*"
description: "arXiv papers"
fetchMode: dom
content:
  item: "article"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
