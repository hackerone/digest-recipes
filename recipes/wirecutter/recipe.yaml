id: wirecutter
version: 1
matches:
  - "https://www.nytimes.com/wirecutter/*"
  - "https://www.wirecutter.com/*"
description: "Wirecutter reviews (metered)"
fetchMode: dom
content:
  item: "article, .post-card"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
