id: washingtonpost
version: 1
matches:
  - "https://www.washingtonpost.com/*"
description: "Washington Post news"
fetchMode: dom
content:
  item: "article"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
