id: newsbreak
version: 1
matches:
  - "https://www.newsbreak.com/*"
description: "NewsBreak local and national news"
fetchMode: tab-dom
content:
  item: "article"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "span"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
