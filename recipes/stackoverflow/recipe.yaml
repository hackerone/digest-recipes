id: stackoverflow
version: 1
matches:
  - "https://stackoverflow.com/*"
description: "Stack Overflow questions (rate-limited)"
fetchMode: tab-dom
content:
  item: "article"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
