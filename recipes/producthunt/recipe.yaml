id: producthunt
version: 1
matches:
  - "https://www.producthunt.com/*"
description: "Product Hunt launches (login-lite)"
fetchMode: tab-dom
content:
  item: "article, .post-card"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
