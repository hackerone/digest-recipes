id: nytimes
version: 1
matches:
  - "https://www.nytimes.com/*"
  - "https://nytimes.com/*"
description: "New York Times news and features"
fetchMode: dom
content:
  item: "article, .css-1l4spti"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1"
  url:
    selector: "a[href]"
    attribute: "href"
  author:
    selector: "[rel='author'], .css-1baulvz"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
