id: pinterest
version: 1
matches:
  - "https://www.pinterest.com/*"
description: "Pinterest pins (login-lite)"
fetchMode: tab-dom
content:
  item: "article, [role='article'], .post"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2, h3"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "a, span"
  body:
    selector: "p, span"
  image:
    selector: "img"
    attribute: "src"
