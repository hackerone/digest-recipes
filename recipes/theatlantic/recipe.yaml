id: theatlantic
version: 1
matches:
  - "https://www.theatlantic.com/*"
description: "The Atlantic long-form journalism"
fetchMode: dom
content:
  item: "article"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: ".article-body p, p"
  image:
    selector: "article img"
    attribute: "src"
