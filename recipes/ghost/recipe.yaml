id: ghost
version: 1
matches:
  - "https://ghost.org/*"
description: "Ghost stories (custom domains out of scope)"
fetchMode: dom
content:
  item: "article, .post-card"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
