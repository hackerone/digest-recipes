id: spotify
version: 1
matches:
  - "https://open.spotify.com/*"
  - "https://spotify.com/*"
description: "Spotify (login-walled)"
fetchMode: tab-dom
content:
  item: "article, .video-card, li"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2, h3"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "a, span"
  body:
    selector: "p"
  image:
    selector: "img"
    attribute: "src"
