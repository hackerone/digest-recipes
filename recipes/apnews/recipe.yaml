id: apnews
version: 1
matches:
  - "https://apnews.com/*"
  - "https://www.apnews.com/*"
description: "AP News articles"
fetchMode: dom
content:
  item: "article, .PagePromo, .Card"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2, h3"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .Page-byline"
  body:
    selector: "p"
  image:
    selector: "article img, img"
    attribute: "src"
