id: npr
version: 1
matches:
  - "https://www.npr.org/*"
  - "https://npr.org/*"
description: "NPR news and audio"
fetchMode: dom
content:
  item: "article, .story-card"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: "p"
  image:
    selector: "article img"
    attribute: "src"
