id: allrecipes
version: 1
matches:
  - "https://www.allrecipes.com/*"
description: "Allrecipes recipes"
fetchMode: dom
content:
  item: "article"
  id:
    selector: "a"
    attribute: "href"
  title:
    selector: "h1, h2"
  url:
    selector: "a"
    attribute: "href"
  author:
    selector: "[rel='author'], .byline"
  body:
    selector: ".recipe-body p, p"
  image:
    selector: "article img"
    attribute: "src"
