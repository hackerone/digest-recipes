id: youtube
version: 2
matches:
  - "https://www.youtube.com/watch*"
  - "https://www.youtube.com/@*"
  - "https://www.youtube.com/channel/*"
  - "https://www.youtube.com/c/*"
  - "https://www.youtube.com/user/*"
  - "https://www.youtube.com/results*"
  - "https://m.youtube.com/watch*"
  - "https://youtu.be/*"
description: "YouTube videos and channel listings"
fetchMode: dom
content:
  item: "ytd-rich-item-renderer, yt-lockup-view-model"
  id:
    selector: "a.ytLockupMetadataViewModelTitle[href*="/watch"], a#video-title-link[href*="/watch"], a#video-title[href*="/watch"]"
    attribute: "href"
  title:
    selector: "a.ytLockupMetadataViewModelTitle span, a.ytLockupMetadataViewModelTitle, #video-title, h1 yt-formatted-string"
  url:
    selector: "a.ytLockupMetadataViewModelTitle[href*="/watch"], a#video-title-link[href*="/watch"], a#video-title[href*="/watch"]"
    attribute: "href"
  author:
    selector: "a[href^="/@"], #channel-name a, ytd-channel-name a, #owner-name a"
  body:
    selector: "yt-content-metadata-view-model, #metadata-line, #description, yt-formatted-string#description"
  image:
    selector: "img.ytCoreImageHost, #thumbnail img, img#img"
    attribute: "src"
